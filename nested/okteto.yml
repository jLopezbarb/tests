# A dependency with its own dependencies.
#
#   parent (wait: true): its manifest, nested/parent.yml, has the dependency child (wait: true)
#
#   ./okteto deploy --dependencies -f nested/okteto.yml
#
# Expected: the block of parent includes the lines of child, as "[parent] [child] ..."
dependencies:
  parent:
    repository: ${DEPS_E2E_REPO}
    branch: ${DEPS_E2E_BRANCH:-main}
    manifest: nested/parent.yml
    wait: true
    variables:
      DEPS_E2E_REPO: ${DEPS_E2E_REPO}
      DEPS_E2E_BRANCH: ${DEPS_E2E_BRANCH:-main}
deploy:
  - name: Main deploy
    command: DEP_NAME=main SLEEP_SECONDS=5 sh ../dependency/dependency.sh
