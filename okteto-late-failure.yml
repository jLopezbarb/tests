# A scheduled `wait: false` dependency fails after the main deploy commands.
#
#   database (10s, wait: true) ──> main deploy commands
#   reports (60s, wait: false, FAILS)
#
#   sh verify.sh reset
#   ./okteto deploy --dependencies -f okteto-late-failure.yml
#   sh verify.sh late-failure
#
# Expected:
#   - reports is only scheduled, and the main deploy runs once database ends
#   - `okteto deploy` succeeds right after the main deploy commands, without waiting for reports
#   - about a minute later, the UI shows the deploy of reports, on its own, as failed
dependencies:
  database:
    repository: ${DEPS_E2E_REPO}
    branch: ${DEPS_E2E_BRANCH:-main}
    manifest: dependency/okteto.yml
    wait: true
    variables:
      SLEEP_SECONDS: '10'
      DEP_NAME: 'database'
  reports:
    repository: ${DEPS_E2E_REPO}
    branch: ${DEPS_E2E_BRANCH:-main}
    manifest: dependency/okteto.yml
    variables:
      SLEEP_SECONDS: '60'
      FAIL: 'true'
      DEP_NAME: 'reports'
deploy:
  - name: Main deploy
    command: DEP_NAME=main SLEEP_SECONDS=5 sh dependency/dependency.sh
