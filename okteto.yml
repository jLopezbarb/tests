# The example from the product spec.
#
#   database (20s) ──┬──> backend (10s, wait: true) ──> main deploy commands
#   messaging (40s) ─┘
#   database ─────────> analytics (90s, wait: false)
#
#   sh verify.sh reset
#   ./okteto deploy --dependencies
#   sh verify.sh success
#
# Expected:
#   - database and messaging start in parallel; analytics is scheduled once database ends;
#     backend starts once database and messaging end
#   - one stage, "Deploy dependencies": the lines of database and messaging are interleaved, each one with its
#     [name] prefix, and each awaited dependency starts with "[name] Deploying dependency '<name>'"
#   - analytics shows a single line, "[analytics] Repository 'analytics' scheduled for deployment"
#   - the main deploy starts after backend, and `okteto deploy` returns without waiting for analytics
dependencies:
  database:
    repository: ${DEPS_E2E_REPO}
    branch: ${DEPS_E2E_BRANCH:-main}
    manifest: dependency/okteto.yml
    variables:
      SLEEP_SECONDS: '20'
      DEP_NAME: 'database'
  messaging:
    repository: ${DEPS_E2E_REPO}
    branch: ${DEPS_E2E_BRANCH:-main}
    manifest: dependency/okteto.yml
    variables:
      SLEEP_SECONDS: '40'
      DEP_NAME: 'messaging'
  backend:
    repository: ${DEPS_E2E_REPO}
    branch: ${DEPS_E2E_BRANCH:-main}
    manifest: dependency/okteto.yml
    depends_on: [database, messaging]
    wait: true
    variables:
      SLEEP_SECONDS: '10'
      DEP_NAME: 'backend'
  analytics:
    repository: ${DEPS_E2E_REPO}
    branch: ${DEPS_E2E_BRANCH:-main}
    manifest: dependency/okteto.yml
    depends_on: database
    variables:
      SLEEP_SECONDS: '90'
      DEP_NAME: 'analytics'
deploy:
  - name: Main deploy
    command: DEP_NAME=main SLEEP_SECONDS=5 sh dependency/dependency.sh
