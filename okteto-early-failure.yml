# A dependency fails before the main deploy commands start.
#
#   database (30s) ──┬──> backend (wait: true)
#   messaging (5s, FAILS) ┘
#   database ──────────> analytics
#
#   sh verify.sh reset
#   ./okteto deploy --dependencies -f okteto-early-failure.yml
#   sh verify.sh early-failure
#
# Expected:
#   - the lines of database and messaging are interleaved; messaging ends with its error and database finishes
#   - nothing new starts after the failure: backend and analytics never start, and the main deploy commands never run
#   - `okteto deploy` fails naming messaging and listing backend and analytics as not deployed
#   - the status is "error", and in the UI the error is the last line of the "Deploy dependencies" stage
dependencies:
  database:
    repository: ${DEPS_E2E_REPO}
    branch: ${DEPS_E2E_BRANCH:-main}
    manifest: dependency/okteto.yml
    variables:
      SLEEP_SECONDS: '30'
      DEP_NAME: 'database'
  messaging:
    repository: ${DEPS_E2E_REPO}
    branch: ${DEPS_E2E_BRANCH:-main}
    manifest: dependency/okteto.yml
    variables:
      SLEEP_SECONDS: '5'
      FAIL: 'true'
      DEP_NAME: 'messaging'
  backend:
    repository: ${DEPS_E2E_REPO}
    branch: ${DEPS_E2E_BRANCH:-main}
    manifest: dependency/okteto.yml
    depends_on: [database, messaging]
    wait: true
    variables:
      DEP_NAME: 'backend'
  analytics:
    repository: ${DEPS_E2E_REPO}
    branch: ${DEPS_E2E_BRANCH:-main}
    manifest: dependency/okteto.yml
    depends_on: database
    variables:
      DEP_NAME: 'analytics'
deploy:
  - name: Main deploy
    command: DEP_NAME=main SLEEP_SECONDS=5 sh dependency/dependency.sh
